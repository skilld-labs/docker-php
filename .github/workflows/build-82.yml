name: Build PHP 8.2

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable php-src tag matching installed apk version (e.g. 8.2.33). Leave empty to skip."
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build-php.yml
    with:
      php: "82"
      version: ${{ inputs.version }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
